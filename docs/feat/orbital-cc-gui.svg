<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B24BF3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9A9E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0B0E14" rx="40" />
  
  <!-- Orbital Ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#2A2F3A" stroke-width="4" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#mainGrad)" stroke-width="2" stroke-dasharray="10 140" opacity="0.6" />
  
  <!-- Icons around the ring -->
  <!-- K -->
  <circle cx="50" cy="120" r="20" fill="#1A1F29" stroke="#444" />
  <text x="50" y="126" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">K</text>
  
  <!-- Q -->
  <circle cx="50" cy="280" r="20" fill="#1A1F29" stroke="#444" />
  <text x="50" y="286" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Q</text>
  
  <!-- i -->
  <circle cx="120" cy="350" r="20" fill="#1A1F29" stroke="#444" />
  <text x="120" y="356" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">i</text>
  
  <!-- P -->
  <circle cx="200" cy="380" r="20" fill="#1A1F29" stroke="#444" />
  <text x="200" y="386" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">P</text>
  
  <!-- * -->
  <circle cx="280" cy="350" r="20" fill="#1A1F29" stroke="#444" />
  <text x="280" y="356" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">*</text>
  
  <!-- Square -->
  <rect x="340" y="270" width="40" height="40" rx="10" fill="#1A1F29" stroke="#444" />
  <rect x="352" y="282" width="16" height="16" rx="2" fill="#FFF" />

  <!-- Code < -->
  <path d="M55 200 L25 200" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
  <path d="M35 190 L25 200 L35 210" stroke="#00D2FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code > -->
  <path d="M345 200 L375 200" stroke="#FF9A9E" stroke-width="4" stroke-linecap="round" />
  <path d="M365 190 L375 200 L365 210" stroke="#FF9A9E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Text CC -->
  <text x="200" y="220" fill="url(#mainGrad)" font-family="Arial, sans-serif" font-size="140" text-anchor="middle" font-weight="900" filter="url(#glow)">CC</text>
  
  <!-- Subtext GUI -->
  <text x="200" y="270" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="40" text-anchor="middle" font-weight="700">GUI</text>
  
  <!-- Slogan -->
  <text x="200" y="300" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">All CLI, One GUI</text>
</svg>