<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B24BF3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9A9E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0B0E14" rx="40" />
  
  <!-- Orbital Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#2A2F3A" stroke-width="4" />
  
  <!-- Icons around the ring -->
  <!-- K -->
  <circle cx="50" cy="120" r="20" fill="#1A1F29" stroke="#444" />
  <text x="50" y="126" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">K</text>
  
  <!-- Q -->
  <circle cx="50" cy="280" r="20" fill="#1A1F29" stroke="#444" />
  <text x="50" y="286" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Q</text>
  
  <!-- i -->
  <circle cx="120" cy="350" r="20" fill="#1A1F29" stroke="#444" />
  <text x="120" y="356" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">i</text>
  
  <!-- P -->
  <circle cx="200" cy="380" r="20" fill="#1A1F29" stroke="#444" />
  <text x="200" y="386" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">P</text>
  
  <!-- * -->
  <circle cx="280" cy="350" r="20" fill="#1A1F29" stroke="#444" />
  <text x="280" y="356" fill="#FFF" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">*</text>
  
  <!-- Square -->
  <rect x="340" y="270" width="40" height="40" rx="10" fill="#1A1F29" stroke="#444" />
  <rect x="352" y="282" width="16" height="16" rx="2" fill="#FFF" />

  <!-- Code < -->
  <path d="M60 200 L30 200" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
  <path d="M40 190 L30 200 L40 210" stroke="#00D2FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code > -->
  <path d="M340 200 L370 200" stroke="#FF9A9E" stroke-width="4" stroke-linecap="round" />
  <path d="M360 190 L370 200 L360 210" stroke="#FF9A9E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- CENTER ROBOT -->
  <g transform="translate(200, 190)">
    <!-- Antenna -->
    <line x1="0" y1="-60" x2="0" y2="-80" stroke="#666" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-85" r="5" fill="#F1C40F" />
    
    <!-- Head -->
    <path d="M-40 -50 L-40 10 Q-40 40 0 40 Q40 40 40 10 L40 -50 Q40 -80 0 -80 Q-40 -80 -40 -50 Z" fill="#ECF0F1" stroke="#95A5A6" stroke-width="2" />
    
    <!-- Face Screen -->
    <path d="M-30 -40 L-30 0 Q-30 20 0 20 Q30 20 30 0 L30 -40 Q30 -60 0 -60 Q-30 -60 -30 -40 Z" fill="#2C3E50" />
    
    <!-- Eyes -->
    <circle cx="-15" cy="-20" r="10" fill="#00D2FF" />
    <circle cx="15" cy="-20" r="10" fill="#00D2FF" />
    
    <!-- Pupils -->
    <circle cx="-13" cy="-22" r="3" fill="#FFF" />
    <circle cx="17" cy="-22" r="3" fill="#FFF" />
    
    <!-- Ears -->
    <path d="M-40 -20 L-55 -20 L-55 0 L-40 0" fill="#E74C3C" />
    <path d="M40 -20 L55 -20 L55 0 L40 0" fill="#E74C3C" />
  </g>
  
  <!-- Subtext GUI -->
  <text x="200" y="280" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="40" text-anchor="middle" font-weight="700">GUI</text>
  
  <!-- Slogan -->
  <text x="200" y="310" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">All CLI, One GUI</text>
</svg>