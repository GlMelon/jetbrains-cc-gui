<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FACFE;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0B0E14" rx="40" />
  
  <!-- CENTER ROBOT: Cool Abstract Head -->
  <g transform="translate(200, 150)" filter="url(#neonGlow)">
    <!-- Outer Hexagon Frame -->
    <path d="M0 -80 L69 -40 L69 40 L0 80 L-69 40 L-69 -40 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" />
    
    <!-- Inner Face Shield -->
    <path d="M0 -55 L48 -27.5 L48 27.5 L0 55 L-48 27.5 L-48 -27.5 Z" fill="#1A1F29" stroke="#2A2F3A" stroke-width="2" />
    
    <!-- Eyes (Horizontal Slits) -->
    <rect x="-30" y="-15" width="20" height="6" fill="#00F2FE" />
    <rect x="10" y="-15" width="20" height="6" fill="#00F2FE" />
    
    <!-- Mouth Grill -->
    <line x1="-15" y1="25" x2="15" y2="25" stroke="#4FACFE" stroke-width="2" />
    <line x1="-10" y1="30" x2="10" y2="30" stroke="#4FACFE" stroke-width="2" />
    
    <!-- Antenna -->
    <line x1="0" y1="-80" x2="0" y2="-100" stroke="#00F2FE" stroke-width="2" />
    <circle cx="0" cy="-105" r="5" fill="#00F2FE" />
  </g>
  
  <!-- Text: Ai Code Gui -->
  <text x="200" y="310" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" font-weight="bold">Ai Code Gui</text>
</svg>