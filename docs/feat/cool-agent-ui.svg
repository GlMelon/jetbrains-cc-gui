<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FACFE;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0B0E14" rx="40" />
  
  <!-- Orbital Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#1E222A" stroke-width="8" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-dasharray="10 160" opacity="0.5" />
  
  <!-- Orbiting Elements (Keywords & Shapes) -->
  <text x="100" y="60" fill="#4FACFE" font-family="monospace" font-size="14" opacity="0.8">Claude</text>
  <text x="280" y="80" fill="#00F2FE" font-family="monospace" font-size="14" opacity="0.8">Codex</text>
  <text x="330" y="200" fill="#4FACFE" font-family="monospace" font-size="14" opacity="0.8">MCP</text>
  <text x="280" y="320" fill="#00F2FE" font-family="monospace" font-size="14" opacity="0.8">Skills</text>
  <text x="80" y="330" fill="#4FACFE" font-family="monospace" font-size="14" opacity="0.8">Plugin</text>
  
  <circle cx="50" cy="180" r="8" fill="#FFF" opacity="0.2" />
  <circle cx="350" cy="220" r="6" fill="#FFF" opacity="0.2" />
  
  <!-- CENTER ROBOT: Cool Abstract Head -->
  <g transform="translate(200, 190)" filter="url(#neonGlow)">
    <!-- Outer Hexagon Frame -->
    <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" />
    
    <!-- Inner Face Shield -->
    <path d="M0 -40 L35 -20 L35 20 L0 40 L-35 20 L-35 -20 Z" fill="#1A1F29" stroke="#2A2F3A" stroke-width="2" />
    
    <!-- Eyes (Horizontal Slits) -->
    <rect x="-25" y="-10" width="15" height="5" fill="#00F2FE" />
    <rect x="10" y="-10" width="15" height="5" fill="#00F2FE" />
    
    <!-- Mouth Grill -->
    <line x1="-15" y1="20" x2="15" y2="20" stroke="#4FACFE" stroke-width="2" />
    <line x1="-10" y1="25" x2="10" y2="25" stroke="#4FACFE" stroke-width="2" />
    
    <!-- Antenna -->
    <line x1="0" y1="-60" x2="0" y2="-80" stroke="#00F2FE" stroke-width="2" />
    <circle cx="0" cy="-85" r="4" fill="#00F2FE" />
  </g>
  
  <!-- Text -->
  <text x="200" y="290" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" font-weight="bold">CC GUI</text>
  <text x="200" y="320" fill="#9CA3AF" font-family="monospace" font-size="16" text-anchor="middle">Unified Agent Interface</text>
</svg>