<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme-Aware Background Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    /* Dark Theme */
    body.dark {
      background: #1e1e1e;
      color: #cccccc;
    }

    /* Light Theme */
    body.light {
      background: #f5f5f5;
      color: #333;
    }

    .container { max-width: 900px; margin: 0 auto; }

    h1 { font-size: 18px; margin-bottom: 16px; }

    .theme-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .theme-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #666;
      cursor: pointer;
      font-size: 13px;
    }

    body.dark .theme-btn { background: #333; color: #ccc; }
    body.light .theme-btn { background: #fff; color: #333; }
    .theme-btn.active { border-color: #4ea1ff; color: #4ea1ff; }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      opacity: 0.6;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .variant {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #444;
    }

    .variant-label {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    body.dark .variant-label { background: #2a2a2a; border-bottom: 1px solid #444; }
    body.light .variant-label { background: #e8e8e8; border-bottom: 1px solid #ddd; }

    /* Header Preview */
    .header-preview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      min-height: 44px;
    }

    .session-title {
      font-size: 13px;
      font-weight: 600;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    body.dark .icon-btn { background: transparent; color: #999; }
    body.light .icon-btn { background: transparent; color: #666; }

    /* StatusPanel Preview */
    .status-tabs {
      display: flex;
      padding: 5px 8px;
      gap: 0;
      font-size: 12px;
      border-radius: 6px;
      margin: 8px;
    }

    .status-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    body.dark .status-tab { color: #999; }
    body.light .status-tab { color: #666; }

    .status-tab svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      margin: 0 8px 8px;
      border-radius: 6px;
    }

    body.dark .empty-state { color: #666; }
    body.light .empty-state { color: #999; }

    /* Color swatches */
    .swatch-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
    }

    body.dark .swatch-row { background: #2a2a2a; }
    body.light .swatch-row { background: #e8e8e8; }

    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .swatch-color {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid rgba(128,128,128,0.3);
    }

    .note {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 16px;
    }

    body.dark .note { background: #2a2a2a; border-left: 3px solid #4ea1ff; }
    body.light .note { background: #fff; border-left: 3px solid #0066cc; }

    .note strong { display: block; margin-bottom: 4px; }
    body.dark .note strong { color: #4ea1ff; }
    body.light .note strong { color: #0066cc; }
  </style>
</head>
<body class="dark">
  <div class="container">
    <h1>🎨 Theme-Aware Background Color Preview</h1>

    <div class="theme-toggle">
      <button class="theme-btn active" onclick="setTheme('dark')">🌙 Dark</button>
      <button class="theme-btn" onclick="setTheme('light')">☀️ Light</button>
    </div>

    <div class="section">
      <div class="section-title">方案对比</div>
      <div class="comparison-grid">

        <!-- Option A: CSS Variable -->
        <div class="variant">
          <div class="variant-label">方案 A: CSS 变量</div>
          <div class="header-preview" style="background: var(--option-a-header);">
            <span class="session-title">Session</span>
            <div style="display:flex;gap:4px;">
              <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
          </div>
          <div class="status-tabs" style="background: var(--option-a-tabs);">
            <div class="status-tab">Tasks</div>
            <div class="status-tab">Subagent</div>
            <div class="status-tab">Edits</div>
          </div>
          <div class="empty-state" style="background: var(--option-a-empty);">No tasks running</div>
        </div>

        <!-- Option B: Hybrid -->
        <div class="variant">
          <div class="variant-label">方案 B: 半透明混合</div>
          <div class="header-preview" style="background: var(--option-b-header);">
            <span class="session-title">Session</span>
            <div style="display:flex;gap:4px;">
              <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
          </div>
          <div class="status-tabs" style="background: var(--option-b-tabs);">
            <div class="status-tab">Tasks</div>
            <div class="status-tab">Subagent</div>
            <div class="status-tab">Edits</div>
          </div>
          <div class="empty-state" style="background: var(--option-b-empty);">No tasks running</div>
        </div>

        <!-- Option C: Fixed with theme override -->
        <div class="variant">
          <div class="variant-label">方案 C: 固定色+主题覆盖</div>
          <div class="header-preview" style="background: var(--option-c-header);">
            <span class="session-title">Session</span>
            <div style="display:flex;gap:4px;">
              <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
          </div>
          <div class="status-tabs" style="background: var(--option-c-tabs);">
            <div class="status-tab">Tasks</div>
            <div class="status-tab">Subagent</div>
            <div class="status-tab">Edits</div>
          </div>
          <div class="empty-state" style="background: var(--option-c-empty);">No tasks running</div>
        </div>

      </div>
    </div>

    <div class="section">
      <div class="section-title">颜色值</div>
      <div class="swatch-row">
        <div class="swatch">
          <div class="swatch-color" style="background: var(--option-a-header);"></div>
          <span>A: <code id="swatch-a"></code></span>
        </div>
        <div class="swatch">
          <div class="swatch-color" style="background: var(--option-b-header);"></div>
          <span>B: <code id="swatch-b"></code></span>
        </div>
        <div class="swatch">
          <div class="swatch-color" style="background: var(--option-c-header);"></div>
          <span>C: <code id="swatch-c"></code></span>
        </div>
      </div>
    </div>

    <div class="note">
      <strong>说明：</strong>
      <span id="note-text"></span>
    </div>
  </div>

  <style>
    /* Dark Theme Variables */
    body.dark {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-titlebar: #323233;
      --bg-chat-overlay: rgba(255, 255, 255, 0.05);
      --border: #3c3c3c;

      /* Option A: Use existing CSS variable */
      --option-a-header: var(--bg-titlebar);
      --option-a-tabs: var(--bg-chat-overlay);
      --option-a-empty: var(--bg-chat-overlay);

      /* Option B: Semi-transparent blend */
      --option-b-header: rgba(43, 45, 48, 0.95);
      --option-b-tabs: rgba(43, 45, 48, 0.9);
      --option-b-empty: rgba(43, 45, 48, 0.9);

      /* Option C: Fixed color */
      --option-c-header: #2b2d30;
      --option-c-tabs: #2b2d30;
      --option-c-empty: #2b2d30;
    }

    /* Light Theme Variables */
    body.light {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-titlebar: #e8e8e8;
      --bg-chat-overlay: rgba(0, 0, 0, 0.04);
      --border: #d4d4d4;

      /* Option A: Use existing CSS variable */
      --option-a-header: var(--bg-titlebar);
      --option-a-tabs: var(--bg-chat-overlay);
      --option-a-empty: var(--bg-chat-overlay);

      /* Option B: Semi-transparent blend */
      --option-b-header: rgba(232, 232, 232, 0.95);
      --option-b-tabs: rgba(200, 195, 180, 0.9);
      --option-b-empty: rgba(200, 195, 180, 0.9);

      /* Option C: Fixed color - bad in light theme */
      --option-c-header: #2b2d30;
      --option-c-tabs: #2b2d30;
      --option-c-empty: #2b2d30;
    }
  </style>

  <script>
    function setTheme(theme) {
      document.body.className = theme;
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(theme === 'dark' ? 'Dark' : 'Light'));
      });
      updateSwatches();
    }

    function updateSwatches() {
      const isDark = document.body.classList.contains('dark');
      document.getElementById('swatch-a').textContent = isDark ? '#323233 / rgba(255,255,255,0.05)' : '#e8e8e8 / rgba(0,0,0,0.04)';
      document.getElementById('swatch-b').textContent = isDark ? 'rgba(43,45,48,0.95)' : 'rgba(232,232,232,0.95)';
      document.getElementById('swatch-c').textContent = '#2b2d30 (固定)';

      document.getElementById('note-text').innerHTML = isDark
        ? '三个方案在暗色主题下都很协调。方案 A 使用现有变量，方案 B 半透明混合更柔和，方案 C 固定色最简单。'
        : '亮色主题下：<br>• <strong>方案 A</strong>：使用现有变量，与主题协调 ✓<br>• <strong>方案 B</strong>：半透明混合，米色调柔和 ✓<br>• <strong>方案 C</strong>：固定深色，对比强烈 ✗';
    }

    updateSwatches();
  </script>
</body>
</html>
