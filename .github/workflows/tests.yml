name: Tests

# CI test coverage for every component of the plugin:
#   - ai-bridge unit tests (node:test)
#   - webview unit tests (vitest + tsc typecheck)
#   - Java unit tests (Linux)
#   - WSL integration tests (Windows + WSL)
# All jobs run in parallel and are intentionally independent of build.yml, so a
# test failure can never block the Build Plugin job.
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  # ai-bridge tests use Node's built-in test runner (node:test). They are
  # invoked from the repository root because api-config.test.js resolves modules
  # via path.resolve('ai-bridge/...') relative to the working directory.
  ai-bridge:
    name: ai-bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          # Cache npm downloads keyed on ai-bridge's lockfile.
          cache: 'npm'
          cache-dependency-path: 'ai-bridge/package-lock.json'

      - name: Install dependencies
        # c8 + istanbul-lib-coverage (coverage gate, docs §11.5 / §T1) live in
        # devDependencies; node_modules is absent on a fresh checkout, so install
        # before any step that imports them.
        working-directory: ai-bridge
        run: npm ci

      - name: Run lint
        working-directory: ai-bridge
        run: npm run lint

      - name: Run typecheck
        working-directory: ai-bridge
        run: npm run typecheck

      - name: Run ai-bridge tests
        # Pure test run kept separate from coverage so a failure points cleanly at
        # the failing test, not the coverage toolchain.
        working-directory: ai-bridge
        run: npm test

      - name: Generate c8 coverage
        # Collects branch + line coverage into ai-bridge/coverage/coverage-final.json.
        # run-coverage.mjs anchors cwd to the repo root (tests resolve modules via
        # path.resolve('ai-bridge/...')) and drives c8 as the node parent process,
        # bypassing the .bin/c8 shim for cross-platform reliability.
        run: node ai-bridge/scripts/run-coverage.mjs

      - name: Check coverage baseline
        # Anti-regression gate (docs §11.5 / §T1 stage 1): fails if total branches
        # or lines drop below the committed baseline in coverage-baseline.json.
        # Direction is inverted vs the i18n locale gate below: coverage baseline is
        # a MINIMUM (higher is better), so actual < baseline = FAIL.
        run: node ai-bridge/scripts/check-coverage.mjs --verbose

  # webview unit tests: vitest run plus a typecheck of the test sources.
  # No build step is needed — the vitest suite operates against source, not dist.
  webview:
    name: webview unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          # Cache npm downloads keyed on webview's lockfile.
          cache: 'npm'
          cache-dependency-path: 'webview/package-lock.json'

      - name: Install dependencies
        working-directory: webview
        run: npm ci

      - name: Generate version file
        # src/version/version.ts is auto-generated from build.gradle by the
        # prebuild script and is gitignored, so it is absent on a fresh
        # checkout. Tests import it (e.g. WelcomeScreen.tsx), so generate it
        # before running vitest.
        working-directory: webview
        run: npm run prebuild

      - name: Run webview tests
        # Pure test run (vitest run + tsc typecheck) kept separate from coverage
        # so a failure points cleanly at the failing test, not the toolchain.
        working-directory: webview
        run: npm run test

      - name: Generate v8 coverage
        # Collects branch + line coverage into webview/coverage/coverage-final.json
        # (v8 provider, all:false = only files imported by tests). Reuses the
        # version file generated above; no separate prebuild needed.
        working-directory: webview
        run: npm run test:coverage

      - name: Check coverage baseline
        # Anti-regression gate (docs §11.5 / §T1 stage 2): fails if total branches
        # or lines drop below the committed baseline in coverage-baseline.json.
        # Direction inverted vs the i18n locale gate: coverage baseline is a
        # MINIMUM, so actual < baseline = FAIL. Baseline frozen at 0.1%
        # granularity because V8 branch counting has ~0.01-0.02% non-determinism.
        working-directory: webview
        run: node scripts/check-coverage.mjs --verbose

  # Webview style checks keep full ESLint coverage while limiting Prettier
  # adoption to files changed after the gate was introduced.
  webview-lint:
    name: webview lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: 'webview/package-lock.json'

      - name: Install dependencies
        working-directory: webview
        run: npm ci

      - name: Run lint and changed-file format checks
        working-directory: webview
        env:
          STYLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STYLE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STYLE_ADOPTION_BASELINE: '1'
        run: npm run check:style

  # Generate frontend protocol constants directly from the Java enum SSOT and
  # reject production code that reintroduces downstream event literals.
  protocol-ssot:
    name: protocol SSOT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: 'webview/package-lock.json'

      - name: Install dependencies
        working-directory: webview
        run: npm ci

      - name: Generate protocol types
        working-directory: webview
        run: node scripts/generate-protocol-types.mjs

      - name: Check downstream event literals
        working-directory: webview
        run: npm run check:event-literals

  # Full Java unit-test suite on Linux. The NodeDetectorWslTest integration
  # tests are Windows+WSL-gated (they Assume Windows+WSL) and are SKIPPED here;
  # they run in the java-wsl job below so the WSL path behaviour is actually
  # exercised.
  java-linux:
    name: Java unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install webview dependencies
        working-directory: webview
        run: npm ci

      - name: Install ai-bridge dependencies
        working-directory: ai-bridge
        run: npm ci

      - name: Run tests
        run: ./gradlew test

      - name: Generate JaCoCo coverage
        # 从 test 步骤产出的 build/jacoco/test.exec 生成 XML(gate 消费 report 级 counter)。
        # jacocoTestReport 不依赖 test,读已有 exec 不重跑。-x buildWebview:class 已编译,
        # 无需重建 webview(省时 + 防边界:规避 fresh 环境 tsc 不在 PATH)。
        run: ./gradlew jacocoTestReport -x buildWebview

      - name: Check Java coverage baseline
        # 防倒退 gate(docs §11.5 / §T1 第三阶段):total branches 或 lines 跌破
        # java-coverage-baseline.json 即 FAIL。方向与 i18n locale gate 相反:coverage baseline
        # 是最小值,actual < baseline = FAIL。JaCoCo 字节码插桩确定性 → 精确冻结(不取整)。
        # 零依赖 .mjs,java-linux 已 setup Node 22,无需新 npm install。
        run: node scripts/check-java-coverage.mjs --verbose

  # Runs the Windows+WSL integration tests that the Linux job cannot exercise.
  # Vampire/setup-wsl installs a real WSL distro so isWslPath /
  # resolveWslHomeUncPath / resolveHomeForFileOps behave as on a developer's
  # Windows+WSL machine. The tests still Assume WSL availability, so they
  # self-skip if the distro fails to come up rather than producing false
  # failures.
  java-wsl:
    name: WSL integration tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Set up WSL
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04

      - name: Install Node.js inside WSL
        shell: wsl-bash {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install webview dependencies
        working-directory: webview
        run: npm ci

      - name: Install ai-bridge dependencies
        working-directory: ai-bridge
        run: npm ci

      - name: Run WSL integration tests
        run: ./gradlew test --tests "com.github.claudecodegui.bridge.NodeDetectorWslTest"

  # Unified frontend + backend i18n baseline gate. Historical gaps are frozen
  # in scripts/i18n-baseline.json and may only stay flat or decrease; backend zh
  # completeness remains a hard requirement.
  i18n:
    name: i18n key coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Check unified i18n key baseline
        run: node scripts/check-i18n-keys.mjs
