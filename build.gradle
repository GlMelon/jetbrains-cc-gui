plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'org.jetbrains.intellij.platform' version '2.10.5'
}

// Load local properties file (not committed to git)
def localPropertiesFile = rootProject.file('local.properties')
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
    println "Loaded local.properties"
}

// Print Java version info
println "Java version: ${System.getProperty('java.version')}"
println "Java home: ${System.getProperty('java.home')}"

// Helper method: prioritize local.properties, fallback to gradle.properties
ext.getLocalProperty = { String key, String defaultValue = null ->
    return localProperties.getProperty(key) ?: project.findProperty(key) ?: defaultValue
}

// Get custom JDK path from local properties (support both property names)
def localJavaHome = getLocalProperty('java.home') ?: getLocalProperty('org.gradle.java.home')

checkstyle {
    toolVersion = '10.12.5'
    configFile = file('checkstyle.xml')
    // Quality gate covers production sources only. Test code legitimately breaks
    // these rules: fixture child-process mains must write to System.out so the
    // parent can capture stdout, and single-element-array lambda captures are a
    // common, harmless test idiom.
    sourceSets = [project.sourceSets.main]
}

// sourceSets above unhooks checkstyleTest from the check lifecycle; disabling the
// task as well makes an explicit `gradlew checkstyleTest` a SKIPPED no-op instead
// of a failure.
tasks.named('checkstyleTest') {
    enabled = false
}

// JaCoCo 覆盖率(§T1 第三阶段 Java 防倒退 gate)。toolVersion 0.8.12 支持 JDK17 class(major 61)。
// 字节码插桩确定性 → baseline 精确冻结(不取整)。与 instrumentCode/instrumentTestCode(已禁用)正交:
// JaCoCo agent 在 test JVM 织入 build/classes/java/test 原始字节码,不与 IntelliJ instrumentationTools 冲突。
jacoco {
    toolVersion = '0.8.12'
}

group = 'com.github.idea-claude-code-gui'
version = '2026.2'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    // Use Java Toolchain for consistent JDK across all tasks
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Configure custom JDK path if specified in local.properties
if (localJavaHome) {
    def javaHomeDir = file(localJavaHome)
    if (javaHomeDir.exists()) {
        println "Using custom Java home: ${localJavaHome}"

        // Set the Java launcher for all JavaExec and Test tasks (except runIde)
        tasks.withType(JavaCompile).configureEach {
            options.fork = true
            options.forkOptions.javaHome = javaHomeDir
        }

        tasks.withType(JavaExec).configureEach {
            // Skip runIde task to use JBR for JCEF support
            if (it.name != 'runIde') {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(17)
                }
            }
        }
    } else {
        println "WARNING: Configured java.home does not exist: ${localJavaHome}"
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    // codex config.toml 模型发现(upstream 合入)
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.snakeyaml:snakeyaml-engine:3.0.1'
    // tar.gz 解压(Skills 市场 GitHub tarball):系统 tar 不可用时纯 Java 兜底
    implementation 'org.apache.commons:commons-compress:1.27.1'
    // OpenCode 1.x stores sessions in ~/.local/share/opencode/opencode.db
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        def targetIde = project.findProperty('targetIde') ?: 'IC'
        if (targetIde == 'PC') {
            pycharmCommunity('2024.3')
            bundledPlugin('PythonCore')
        } else if (targetIde == 'PY') {
            pycharmProfessional('2024.3')
            bundledPlugin('Pythonid')
        } else if (targetIde == 'RD') {
            // Rider 2025.3.2
            rider('2025.3.2')
            // Enable Terminal Plugin support
            bundledPlugin('org.jetbrains.plugins.terminal')
        } else {
            intellijIdeaCommunity('2024.3.1')
            bundledPlugin('com.intellij.java')
            // Add Python plugin to support compiling PythonContextCollector
            plugin('PythonCore', '243.22562.145')
            // Enable Terminal Plugin support
            bundledPlugin('org.jetbrains.plugins.terminal')
        }

        // Git4Idea is bundled in all JetBrains IDEs that support Git
        // (IC/PC/PY/RD). Required so we can run a real `git diff` via
        // git4idea.commands.* for the Commit AI feature.
        bundledPlugin('Git4Idea')

        instrumentationTools()

        // IDEs to verify the plugin against (used by `verifyPlugin` task).
        // Mirrors what JetBrains Marketplace runs so we can catch binary
        // incompatibility (e.g. new abstract methods in JCEF) before upload.
        pluginVerifier()
    }
}

def verifierIde = project.findProperty('verifierIde')?.toString()?.toUpperCase()
def supportedVerifierIdes = ['IC', 'PC', 'WS', 'IU']
if (verifierIde != null && !supportedVerifierIdes.contains(verifierIde)) {
    throw new GradleException("Unsupported verifierIde '${verifierIde}'; expected one of ${supportedVerifierIdes}")
}

intellijPlatform {
    pluginVerification {
        // Keep local verification focused on binary/internal API compatibility
        // issues that match Marketplace rejection criteria.
        failureLevel = [
            org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
            org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel.INTERNAL_API_USAGES
        ]

        // PythonCore is pinned to 243.x for compileOnly use across the
        // sinceBuild=233 .. untilBuild=263.* range. Verifier on 262.x EAP
        // cannot resolve com.jetbrains.python classes from a 243.x PythonCore,
        // so we mark the package as external — references from the optional
        // python-features.xml content module are guarded by the optional
        // dependency on com.intellij.modules.python at runtime.
        externalPrefixes = ['com.jetbrains.python']

        ides {
            // A5 optional-language isolation matrix: Java present, Python present,
            // and neither language plugin present (platform-only fallback).
            if (verifierIde == null || verifierIde == 'IC') {
                ide('IC', '2024.3.1')
            }
            if (verifierIde == null || verifierIde == 'PC') {
                ide('PC', '2024.3')
            }
            if (verifierIde == null || verifierIde == 'WS') {
                ide('WS', '2024.3')
            }

            // 2026.2 EAP build 262.6228.19 – the exact build that surfaced
            // the CefResourceHandler / PluginManagerCore issues during
            // marketplace verification.
            if (verifierIde == null || verifierIde == 'IU') {
                ide('IU', '262.6228.19')
            }
        }
    }
}

sourceSets {
    main {
        java {
            def targetIde = project.findProperty('targetIde') ?: 'IC'
            // PyCharm: exclude Java context collector
            if (targetIde == 'PC' || targetIde == 'PY') {
                exclude '**/JavaContextCollector.java'
                exclude '**/JavaClassNavigationSupport.java'
            }
            // Rider: exclude both Java and Python context collectors (no PSI support)
            if (targetIde == 'RD') {
                exclude '**/JavaContextCollector.java'
                exclude '**/JavaClassNavigationSupport.java'
                exclude '**/PythonContextCollector.java'
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Ensure consistent source/target compatibility
    options.release.set(17)
}

// Ensure plugin.xml is patched with the correct since/until build and change notes
patchPluginXml {
    // plugin compatibility range
    sinceBuild = '233'
    untilBuild = '263.*'

    // Release notes shown in plugin repositories
    // Dynamically load the latest changelog entry from CHANGELOG.md and convert to simple HTML.
    def changelogFile = file('CHANGELOG.md')
    def computedChangeNotes = ''
    if (changelogFile.exists()) {
        def lines = changelogFile.readLines('UTF-8')
        // Find first section header (lines starting with '#####')
        def start = -1
        for (int i = 0; i < lines.size(); i++) {
            if (lines[i].trim().startsWith('#####')) {
                start = i
                break
            }
        }

        if (start >= 0) {
            def sb = new StringBuilder()
            boolean inList = false
            int i = start + 1
            while (i < lines.size() && !lines[i].trim().startsWith('#####')) {
                def line = lines[i]
                def t = line.trim()

                if (t.startsWith('- ')) {
                    if (!inList) { sb.append('<ul>'); inList = true }
                    def item = t.substring(2)
                    // remove checkbox markers like [x] or [ ]
                    if (item.startsWith('[') && item.length() > 3 && item.charAt(2) == ']') {
                        item = item.substring(3).trim()
                    }
                    item = item.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                    sb.append('<li>' + item + '</li>')
                } else if (t.startsWith('![') || t.startsWith('<img')) {
                    // skip images
                } else if (t.length() == 0) {
                    if (inList) { sb.append('</ul>'); inList = false }
                    sb.append('<br/>')
                } else {
                    if (inList) { sb.append('</ul>'); inList = false }
                    // paragraph
                    def para = t.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                    sb.append('<p>' + para + '</p>')
                }

                i++
            }
            if (inList) { sb.append('</ul>') }
            computedChangeNotes = sb.toString()
        }
    }

    changeNotes = computedChangeNotes ?: '<p>No changelog found.</p>'
}

// macOS: Finder may recreate .DS_Store inside build/ while Gradle's Delete task is
// removing it, which fails with "New files were found". Bypass Gradle's strict
// directory-delete check and remove build/ with a tolerant strategy instead.
tasks.named('clean', Delete) {
    // Clear targets registered by the Java plugin so the strict Delete action is a no-op.
    delete = []
    doLast {
        def buildDir = layout.buildDirectory.get().asFile
        if (!buildDir.exists()) {
            return
        }
        // Prefer shell rm on macOS — more resilient to concurrent .DS_Store writes.
        def isMac = System.getProperty('os.name', '').toLowerCase().contains('mac')
        if (isMac) {
            providers.exec {
                commandLine 'rm', '-rf', buildDir.absolutePath
            }.result.get()
        } else {
            ant.delete(dir: buildDir, failonerror: false)
        }
        if (buildDir.exists()) {
            // One more attempt after stripping junk metadata files
            buildDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name == '.DS_Store' || f.name == 'Thumbs.db') {
                    f.delete()
                }
            }
            ant.delete(dir: buildDir, failonerror: false)
        }
        if (buildDir.exists()) {
            throw new GradleException("Unable to delete build directory: ${buildDir}")
        }
    }
}

// Disable product-specific searchable options/instrument tasks if present
// Use matching to cover task name variants like buildSearchableOptionsIC / buildSearchableOptionsIU etc.
tasks.matching { it.name.startsWith('buildSearchableOptions') }.configureEach {
    enabled = false
}

tasks.named('buildSearchableOptions') {
    enabled = false
}

tasks.named('instrumentCode') {
    enabled = false
}

// 与 instrumentCode 对称:禁用 test 插桩。
// 否则 `./gradlew test -x instrumentTestCode` 时,test 任务仍会读取 stale 插桩产物
// (build/instrumented/instrumentTestCode),它不会随新增测试方法更新,
// 导致测试发现基于旧插桩字节码 → 新增 @Test 方法不被执行(假绿)。
tasks.named('instrumentTestCode') {
    enabled = false
}

tasks.named('jarSearchableOptions') {
    enabled = false
}

// test task 的 jacoco 运行时配置。IntelliJ Platform 2022.1+ 用 PathClassLoader 作 system class loader,
// JaCoCo agent 默认只发现 bootstrap classloader 的类 → 插件类不进 test.exec、XML 全 covered=0(实测 INSTRUCTION covered=0/885 class 全 missed)。
// includeNoLocationClasses=true(=jacocoagent inclnolocationclasses=true)让 agent 捕获 PathClassLoader 加载的
// "无位置信息"插件类(官方 FAQ「JaCoCo Reports 0% Coverage」workaround)。excludes jdk.internal.* 去 JDK 内部噪声。
// instrumentCode 已禁用 → 不需 classDirectories.setFrom(instrumentCode)(该条仅 instrumentCode enabled 时需要)。
test {
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

// JaCoCo 报告配置。gate(scripts/check-java-coverage.mjs)消费 XML report 级 counter。
// classDirectories 必须显式收紧:
// (1) intellij.platform 2.10.5 把大量 IDE jar 塞进 classpath,不收紧会把 IDE 类算进分母(数字失真);
// (2) ui/(336K ~40% main 源码)是 JCEF/toolwindow 平台胶水,近乎无法单测,留着拖到噪声区
//     (对标 ai-bridge c8 all:false「排除噪声让数字健康」)。
// 不加 dependsOn test(gate 三步分离,失败归因清晰);apply jacoco 后 test task 自动追加 agent 写 test.exec。
jacocoTestReport {
    reports {
        xml.required = true   // gate 消费,默认 build/reports/jacoco/test/jacocoTestReport.xml
        html.required = true  // dev 排查未覆盖代码;CI 不消费但成本低
        csv.required = false
    }
    classDirectories.setFrom(fileTree("${layout.buildDirectory.get()}/classes/java/main") {
        // exclude 在 ConfigurableFileTree 闭包里是方法调用(exclude 'pattern'),非属性赋值。
        exclude 'com/github/claudecodegui/i18n/**'                              // 平台生成的 bundle holder
        exclude 'com/github/claudecodegui/ui/**'                                // JCEF/toolwindow/delegate 胶水(336K)
        exclude 'com/github/claudecodegui/startup/**'                           // 生命周期 listener 样板
        exclude 'com/github/claudecodegui/protocol/ProtocolManifestGenerator*'  // 构建工具,默认禁用 task
        exclude 'com/github/claudecodegui/util/JsUtils*'                        // JCEF JS 桥胶水
    })
    sourceDirectories.setFrom(sourceSets.main.java.srcDirs)
}

tasks.named('runIde') {
    jvmArgumentProviders.add({
        [
            '-Djcef.sandbox.enable=false',
            // Disable automatic plugin unloading (prevents unloading when file changes are detected)
            '-Didea.auto.reload.plugins=false',
            // Disable dynamic plugin unloading
            '-Didea.dynamic.plugins.allowed=false',
            // Enable internal mode
            '-Didea.is.internal=true',
            // Disable file system event monitoring (optional)
            // '-Didea.filewatcher.disabled=true',
            // Increase plugin loading timeout
            '-Didea.plugins.load.timeout=60000'
        ]
    } as CommandLineArgumentProvider)

    // Set system properties
    systemProperty 'idea.auto.reload.plugins', 'false'
    systemProperty 'idea.dynamic.plugins.allowed', 'false'
    systemProperty 'idea.is.internal', 'true'
    systemProperty 'idea.plugin.in.sandbox.mode', 'true'

    // Configure log output to console
    systemProperty 'idea.log.debug.categories', '#com.github.claudecodegui'

    // MCP Gateway 默认已在 McpGatewayFeatureFlags 全开(catalog 预热消除首次冷连接延迟,
    // SDK 三 provider Claude/Codex/OpenCode 对称)。开发期无需在此显式注入 flag;如需紧急关停,
    // 在上面 jvmArgumentProviders 里加 '-DmcpGateway.enabled=false'(或 cli/sdk 子开关)。
    // 运维前提:stdio-client 必须容忍坏 MCP(ENOENT 等)不崩整个 gateway,否则单个坏 MCP 会让
    // gateway 崩溃-重启循环、每次 send 都"第一次很慢"(已修,见 stdio-client.js process.on('error'))。

    // Point bridge resolver to pre-extracted ai-bridge with node_modules (dev only)
    def stableBridge = layout.buildDirectory.dir("stable-ai-bridge").get().asFile
    if (stableBridge.exists()) {
        systemProperty 'claude.bridge.path', stableBridge.absolutePath
    }

    // Redirect standard output
    standardOutput = System.out
    errorOutput = System.err

    // Copy custom configuration to sandbox
    doFirst {
        def sandboxConfig = file('sandbox-idea.properties')
        if (sandboxConfig.exists()) {
            def sandboxDir = layout.buildDirectory.dir("idea-sandbox").get().asFile
            def configDir = new File(sandboxDir, 'config')
            configDir.mkdirs()

            copy {
                from sandboxConfig
                into configDir
                rename { 'idea.properties' }
            }
            println "Copied sandbox config to: ${configDir}/idea.properties"
        }
    }
}

// Unified AI Bridge (merging Claude and Codex)
def aiBridgeDir = file("ai-bridge")
def aiBridgePackDir = layout.buildDirectory.dir('ai-bridge-pack').get().asFile
def aiBridgeArchive = new File(aiBridgePackDir, 'ai-bridge.zip')
def aiBridgeHashFile = new File(aiBridgePackDir, 'ai-bridge.hash')

// Build webview automatically
def webviewDir = file('webview')
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def enableVConsoleInWebview = requestedTasks.any { it.contains('runide') }
def skipWebviewBuild = (project.findProperty('skipWebview') ?: 'false').toString().toBoolean()

// Get custom Node.js path from local properties
def localNodePath = getLocalProperty('node.path')

tasks.register('buildWebview', Exec) {
    workingDir webviewDir
    environment 'VITE_ENABLE_VCONSOLE', enableVConsoleInWebview ? 'true' : 'false'

    // Determine npm command path with robust detection
    def npmCommand = 'npm'
    if (localNodePath) {
        def nodeFile = file(localNodePath)
        def npmExecutable = null
        def pathToAdd = null

        if (nodeFile.isFile()) {
            // localNodePath points to node executable (e.g., /usr/local/bin/node)
            // npm should be in the same directory
            def binDir = nodeFile.parentFile
            def npmInSameDir = new File(binDir, 'npm')
            if (npmInSameDir.exists()) {
                npmExecutable = npmInSameDir
                pathToAdd = binDir.absolutePath
            }
        } else if (nodeFile.isDirectory()) {
            // localNodePath points to a directory, check multiple possible locations
            // Case 1: bin/npm (standard installation like /usr/local/node/bin/npm)
            def npmInBin = new File(nodeFile, 'bin/npm')
            // Case 2: npm directly in directory (e.g., /usr/local/bin/npm)
            def npmInDir = new File(nodeFile, 'npm')

            if (npmInBin.exists()) {
                npmExecutable = npmInBin
                pathToAdd = new File(nodeFile, 'bin').absolutePath
            } else if (npmInDir.exists()) {
                npmExecutable = npmInDir
                pathToAdd = nodeFile.absolutePath
            }
        }

        if (npmExecutable != null) {
            npmCommand = npmExecutable.absolutePath
            println "Using npm executable: ${npmCommand}"
        }

        if (pathToAdd != null) {
            def currentPath = System.getenv('PATH') ?: ''
            environment 'PATH', "${pathToAdd}${File.pathSeparator}${currentPath}"
        }

        println "Using custom Node.js path: ${localNodePath}"
    }

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', npmCommand, 'run', 'build'
    } else {
        commandLine npmCommand, 'run', 'build'
    }

    // Declare inputs/outputs so Gradle can skip the task when nothing changed.
    // `npm run build` = prebuild (scripts/extract-version.mjs +
    // scripts/generate-protocol-types.mjs) + `tsc && vite build`.
    // The standard multi-file Vite output is copied into the plugin resources
    // by processResources under /webview, preserving ES modules and lazy chunks.
    // Inputs are limited to files the build script actually reads (test-only
    // configs such as tsconfig.test.json / vitest.config.ts /
    // playwright.config.ts are excluded so editing tests does not invalidate
    // webview build).
    inputs.dir(file("${webviewDir}/src"))
        .withPropertyName('webview-src')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(
            file("${webviewDir}/package.json"),
            file("${webviewDir}/package-lock.json"),
            file("${webviewDir}/vite.config.ts"),
            file("${webviewDir}/tsconfig.json"),
            file("${webviewDir}/index.html"),
        ).withPropertyName('webview-config')
         .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(file("${webviewDir}/scripts"))
        .withPropertyName('webview-scripts')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(file("${webviewDir}/dist"))
        .withPropertyName('webview-dist')

    onlyIf { webviewDir.exists() && !skipWebviewBuild }
    if (skipWebviewBuild) {
        println "Skipping webview build because -PskipWebview=true"
    }
    doFirst { println "Building webview..." }
    doLast { println "Webview build completed." }
}

// ── Protocol SSOT ──
// 注意:webview/scripts/generate-protocol-types.mjs 已改为构建时直接解析 Java 枚举源
// (UpstreamAction.java / DownstreamEvent.java) 生成 webview/src/generated/protocol.ts,
// 不再依赖本 task 产出的 manifest。本 task 保留为可选/兼容产物,供需要 manifest
// 中间态的工具(ProtocolManifestGenerator)手动调用,亦可作为 mjs 解析结果的人工校验入口。
tasks.register('generateProtocol', JavaExec) {
    description = '[可选·默认禁用] 生成 protocol-manifest.json(mjs 构建链路不依赖此产物;人工校验/C8 反射交叉验证入口,需 -PgenerateProtocol=true 显式开启)'
    group = 'protocol'

    // 默认禁用:标准构建链不触发本 task(mjs 直读 Java 源为 SSOT 主路径,不消费 manifest)。
    // 仅在需要反射路径交叉校验或人工核对 manifest 中间态时,
    // 通过 `gradle generateProtocol -PgenerateProtocol=true` 显式开启。
    enabled = project.findProperty('generateProtocol')?.toString() == 'true'

    dependsOn 'classes'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.claudecodegui.protocol.ProtocolManifestGenerator'

    // Output to webview/src/generated/ so frontend build can consume it
    def manifestPath = file("${projectDir}/webview/src/generated/protocol-manifest.json").absolutePath
    args = [manifestPath]

    doFirst { println "Generating protocol manifest..." }
    doLast  { println "Protocol manifest generation completed." }
}

// Ensure processResources packages the freshly built multi-file webview.
tasks.named('compileJava') {
    dependsOn('buildWebview')
}

tasks.named('processResources') {
    dependsOn('buildWebview')
    from(file("${webviewDir}/dist")) {
        into 'webview'
    }
}

// Use system zip command to package ai-bridge, preserving file permissions
tasks.register('packageAiBridge', Exec) {
    onlyIf { aiBridgeDir.exists() }

    // Switch to ai-bridge directory for packaging, avoiding inclusion of top-level directory
    workingDir aiBridgeDir

    // Ensure output directory exists and dependencies are installed
    doFirst {
        aiBridgePackDir.mkdirs()
        // Delete old zip file
        if (aiBridgeArchive.exists()) {
            aiBridgeArchive.delete()
        }
        // Install npm dependencies if node_modules doesn't exist
        if (!new File(aiBridgeDir, 'node_modules').exists()) {
            println 'Installing ai-bridge npm dependencies...'
            String npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
            exec { commandLine npmCmd, 'install', '--silent', '--loglevel=error'; workingDir = aiBridgeDir }
            println 'ai-bridge npm dependencies installed.'
        }
    }

    // Use system zip command, -r for recursive, -y to preserve symlinks
    // Exclude SDK packages (they will be installed on-demand by users to ~/.codemoss/dependencies/)
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        // Windows: Use PowerShell to exclude SDK packages
        // Create temporary PowerShell script file to avoid escaping issues
        def tempScript = File.createTempFile('ai-bridge-pack', '.ps1')
        tempScript.deleteOnExit()

        def scriptContent = '''
            $excludePatterns = @(
                '*node_modules\\.pnpm*',
                '*node_modules\\@anthropic-ai*',
                '*node_modules\\@openai*'
            )
            $tempDir = Join-Path $env:TEMP "ai-bridge-temp-$(Get-Random)"
            New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
            try {
                Get-ChildItem -Path . -Recurse -Force | Where-Object {
                    $itemPath = $_.FullName
                    $shouldExclude = $false
                    foreach ($pattern in $excludePatterns) {
                        if ($itemPath -like $pattern) {
                            $shouldExclude = $true
                            break
                        }
                    }
                    -not $shouldExclude
                } | ForEach-Object {
                    $relativePath = $_.FullName.Substring((Get-Location).Path.Length + 1)
                    $dest = Join-Path $tempDir $relativePath
                    if ($_.PSIsContainer) {
                        if (-not (Test-Path $dest)) {
                            New-Item -ItemType Directory -Path $dest -Force | Out-Null
                        }
                    } else {
                        $destDir = Split-Path $dest -Parent
                        if (-not (Test-Path $destDir)) {
                            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
                        }
                        Copy-Item $_.FullName -Destination $dest -Force
                    }
                }
                Compress-Archive -Path "$tempDir\\*" -DestinationPath "''' + aiBridgeArchive.absolutePath.replace('\\', '\\\\') + '''" -Force
            } finally {
                if (Test-Path $tempDir) {
                    Remove-Item -Path $tempDir -Recurse -Force
                }
            }
            '''
        tempScript.text = scriptContent
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', tempScript.absolutePath
    } else {
        // Unix/Linux/macOS: Use zip command to preserve permissions
        // Exclude SDK package directories
        commandLine 'zip', '-r', '-y', aiBridgeArchive.absolutePath,
            '.',
            '-x', '*/node_modules/.pnpm/*',
            '-x', '*/node_modules/@anthropic-ai/*',
            '-x', '*/node_modules/@openai/*'
    }

    doLast {
        if (aiBridgeArchive.exists()) {
            println "✓ ai-bridge.zip created: ${aiBridgeArchive.absolutePath}"
            println "  Size: ${aiBridgeArchive.length() / 1024 / 1024} MB"

            // Generate ai-bridge.hash file (SHA-256)
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            aiBridgeArchive.withInputStream { is ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = is.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            def hashHex = digest.digest().collect { String.format('%02x', it) }.join('')
            aiBridgeHashFile.text = hashHex
            println "✓ ai-bridge.hash created: ${hashHex}"
        } else {
            throw new GradleException("Packaging failed: ai-bridge.zip was not generated")
        }
    }
}

// Extract plugin name
def pluginName = project.name
def composedPluginJarProvider = tasks.named('composedJar').flatMap { it.archiveFile }
def runIdeRequested = requestedTasks.any { it.contains('runide') }

def parsePluginDescriptor = { byte[] descriptorBytes, String descriptorPath ->
    try {
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setNamespaceAware(true)
        factory.setXIncludeAware(false)
        factory.setExpandEntityReferences(false)
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
        factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
        factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)

        def document = factory.newDocumentBuilder().parse(new ByteArrayInputStream(descriptorBytes))
        def root = document.documentElement
        if (root?.nodeName != 'idea-plugin') {
            throw new GradleException("Plugin descriptor '${descriptorPath}' must use <idea-plugin> as its root element")
        }
        def children = root.childNodes
        for (int index = 0; index < children.length; index++) {
            def child = children.item(index)
            if (child.nodeType == org.w3c.dom.Node.ELEMENT_NODE && child.nodeName == 'extensionPoint') {
                throw new GradleException(
                    "Invalid plugin descriptor '${descriptorPath}': top-level <extensionPoint> must be wrapped in <extensionPoints>"
                )
            }
        }
        document
    } catch (GradleException error) {
        throw error
    } catch (Exception error) {
        throw new GradleException("Invalid plugin descriptor '${descriptorPath}': ${error.message}", error)
    }
}

def validatePluginDescriptorArchive = { File archiveFile ->
    if (!archiveFile.isFile()) {
        throw new GradleException("Plugin archive does not exist: ${archiveFile.absolutePath}")
    }

    def archive = new java.util.zip.ZipFile(archiveFile)
    try {
        def mainDescriptorPath = 'META-INF/plugin.xml'
        def mainDescriptors = Collections.list(archive.entries()).findAll {
            !it.directory && it.name == mainDescriptorPath
        }
        if (mainDescriptors.size() != 1) {
            throw new GradleException(
                "Plugin archive '${archiveFile.name}' must contain exactly one ${mainDescriptorPath}, found ${mainDescriptors.size()}"
            )
        }

        def mainDescriptorBytes = archive.getInputStream(mainDescriptors.first()).withCloseable { it.bytes }
        def mainDocument = parsePluginDescriptor(mainDescriptorBytes, "${archiveFile.name}!/${mainDescriptorPath}")
        def configFiles = new LinkedHashSet<String>()
        def elements = mainDocument.getElementsByTagName('*')
        for (int index = 0; index < elements.length; index++) {
            def element = elements.item(index)
            if (element.hasAttribute('config-file')) {
                def configFile = element.getAttribute('config-file')?.trim()?.replace('\\', '/')
                if (configFile) {
                    if (configFile.startsWith('/') || configFile.tokenize('/').contains('..')) {
                        throw new GradleException(
                            "Plugin descriptor '${mainDescriptorPath}' contains unsafe config-file path '${configFile}'"
                        )
                    }
                    configFiles.add(configFile.startsWith('META-INF/') ? configFile : "META-INF/${configFile}")
                }
            }
        }

        configFiles.each { configFilePath ->
            def configEntry = archive.getEntry(configFilePath)
            if (configEntry == null || configEntry.directory) {
                throw new GradleException(
                    "Plugin archive '${archiveFile.name}' is missing referenced descriptor '${configFilePath}'"
                )
            }
            def configBytes = archive.getInputStream(configEntry).withCloseable { it.bytes }
            parsePluginDescriptor(configBytes, "${archiveFile.name}!/${configFilePath}")
        }

        configFiles
    } catch (java.util.zip.ZipException error) {
        throw new GradleException("Invalid plugin archive '${archiveFile.absolutePath}': ${error.message}", error)
    } finally {
        archive.close()
    }
}

def sha256 = { File source ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { stream ->
        def buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join('')
}

def verifyPluginDescriptorsTask = tasks.register('verifyPluginDescriptors') {
    group = 'verification'
    description = 'Validates plugin.xml and every referenced config-file descriptor in the composed plugin JAR.'
    dependsOn('composedJar')
    inputs.file(composedPluginJarProvider)

    doLast {
        def archiveFile = composedPluginJarProvider.get().asFile
        def configFiles = validatePluginDescriptorArchive(archiveFile)
        println "Validated plugin descriptors in ${archiveFile.name}: META-INF/plugin.xml" +
            (configFiles.isEmpty() ? '' : ", ${configFiles.join(', ')}")
    }
}

def prepareRunIdeSandboxTask = tasks.named('prepareSandbox')
def runIdePluginDirectoryProvider = prepareRunIdeSandboxTask.flatMap { it.pluginDirectory }
def verifyRunIdeSandboxPluginTask = tasks.register('verifyRunIdeSandboxPlugin') {
    group = 'verification'
    description = 'Verifies that the runIde sandbox contains the freshly composed plugin JAR and valid descriptors.'
    dependsOn(prepareRunIdeSandboxTask, verifyPluginDescriptorsTask)
    inputs.file(composedPluginJarProvider)
    inputs.dir(runIdePluginDirectoryProvider)

    doLast {
        def composedJar = composedPluginJarProvider.get().asFile
        def pluginDirectory = runIdePluginDirectoryProvider.get().asFile
        def sandboxJar = new File(pluginDirectory, "lib/${composedJar.name}")
        if (!sandboxJar.isFile()) {
            throw new GradleException("Sandbox plugin JAR does not exist: ${sandboxJar.absolutePath}")
        }

        def composedHash = sha256(composedJar)
        def sandboxHash = sha256(sandboxJar)
        if (composedHash != sandboxHash) {
            throw new GradleException(
                "Sandbox plugin JAR is stale: expected SHA-256 ${composedHash}, found ${sandboxHash} at ${sandboxJar.absolutePath}"
            )
        }

        validatePluginDescriptorArchive(sandboxJar)
        println "Validated runIde sandbox plugin JAR: ${sandboxJar.absolutePath}"
    }
}

// runIde must never reuse a stale descriptor or plugin archive from an incremental build.
// Rebuild only the archive/resource chain and replace this plugin's sandbox directory;
// sandbox config, logs, system caches, and other installed plugins are preserved.
if (runIdeRequested) {
    tasks.matching {
        it.name in ['patchPluginXml', 'processResources', 'jar', 'instrumentedJar', 'composedJar']
    }.configureEach {
        outputs.upToDateWhen { false }
    }
}

tasks.matching { it.name.startsWith('prepareSandbox') }.configureEach {

    dependsOn('buildWebview', 'packageAiBridge')
    // Declare ai-bridge files as task inputs so changes to JS source
    // invalidate the UP-TO-DATE check and ensure doLast (copy/cleanup) runs.
    inputs.files(aiBridgeArchive, aiBridgeHashFile)
    def sandboxRootProvider = layout.buildDirectory.dir('idea-sandbox')
    // Capture needed file references during configuration phase
    def archiveSource = aiBridgeArchive
    def hashSource = aiBridgeHashFile
    def bridgeDir = aiBridgeDir

    if (runIdeRequested) {
        outputs.upToDateWhen { false }
        doFirst {
            def sandboxRoot = sandboxDirectory.get().asFile.canonicalFile.toPath()
            def sandboxPluginDirectory = pluginDirectory.get().asFile.canonicalFile
            if (!sandboxPluginDirectory.toPath().startsWith(sandboxRoot)) {
                throw new GradleException(
                    "Refusing to refresh sandbox plugin outside '${sandboxRoot}': ${sandboxPluginDirectory.absolutePath}"
                )
            }
            if (sandboxPluginDirectory.exists()) {
                project.delete(sandboxPluginDirectory)
                println "Refreshed sandbox plugin directory: ${sandboxPluginDirectory.absolutePath}"
            }
        }
    }

    doLast {
        if (!bridgeDir.exists() && !archiveSource.exists()) {
            throw new GradleException('ai-bridge directory does not exist. Please ensure it has been pulled and dependencies installed.')
        }
        def sandboxRoot = sandboxRootProvider.get().asFile

        // Find all plugin directories (including versioned ones like IC-2024.3.1/plugins/)
        def pluginDirs = []

        // Direct plugins directory
        def directPluginDir = new File(sandboxRoot, "plugins/${pluginName}")
        if (directPluginDir.exists() || directPluginDir.parentFile.exists()) {
            pluginDirs.add(directPluginDir)
        }

        // Versioned plugin directories (IC-*/plugins/, PC-*/plugins/, etc.)
        sandboxRoot.listFiles()?.each { file ->
            if (file.isDirectory() && file.name.matches(/[A-Z]+-\d+\.\d+\.\d+/)) {
                def versionedPluginDir = new File(file, "plugins/${pluginName}")
                if (versionedPluginDir.exists() || versionedPluginDir.parentFile.exists()) {
                    pluginDirs.add(versionedPluginDir)
                }
            }
        }

        if (pluginDirs.isEmpty()) {
            println "Warning: No plugin directories found in sandbox"
        }

        // Copy ai-bridge.zip to all found plugin directories
        pluginDirs.each { pluginDir ->
            println "Copying ai-bridge to: ${pluginDir.absolutePath}"

            def extractedDir = new File(pluginDir, 'ai-bridge')
            def archiveTarget = new File(pluginDir, 'ai-bridge.zip')
            def hashTarget = new File(pluginDir, 'ai-bridge.hash')

            // Ensure plugin directory exists
            pluginDir.mkdirs()

            // Use ant tasks for delete and copy, avoiding project.* methods
            ant.delete(dir: extractedDir, failonerror: false)
            ant.delete(file: archiveTarget, failonerror: false)
            ant.delete(file: hashTarget, failonerror: false)
            ant.copy(file: archiveSource, todir: pluginDir)
            if (hashSource.exists()) {
                ant.copy(file: hashSource, todir: pluginDir)
            }

            println "✓ ai-bridge.zip copied to: ${archiveTarget.absolutePath}"
        }
    }
}

// Configure tasks after prepareSandbox to ensure ai-bridge.zip is included
tasks.matching { it.name == 'preparePluginForDistribution' || it.name == 'composedJar' }.configureEach {
    dependsOn('packageAiBridge')
}

tasks.named('runIde') {
    dependsOn(verifyRunIdeSandboxPluginTask)
}

tasks.named('buildPlugin') {
    dependsOn('packageAiBridge', 'checkstyleMain')
    // Invalidate UP-TO-DATE when ai-bridge.zip content changes.
    inputs.files(aiBridgeArchive, aiBridgeHashFile)

    doLast {
        // Unzip the plugin zip, add ai-bridge.zip and ai-bridge.hash, then repackage
        def distributionFile = archiveFile.get().asFile
        if (distributionFile.exists() && aiBridgeArchive.exists()) {
            def tempDir = file("${layout.buildDirectory.get()}/tmp/plugin-repack")
            delete(tempDir)

            // Unzip
            copy {
                from zipTree(distributionFile)
                into tempDir
            }

            // Find the plugin directory and add ai-bridge.zip and ai-bridge.hash
            def pluginDir = new File(tempDir, pluginName)
            if (pluginDir.exists()) {
                copy {
                    from aiBridgeArchive
                    from aiBridgeHashFile
                    into pluginDir
                }

                // Delete searchableOptions jar if present
                fileTree(new File(pluginDir, 'lib')).matching {
                    include '**/*searchableOptions*.jar'
                }.each { jarFile ->
                    delete(jarFile)
                    println "Deleted searchableOptions jar: ${jarFile.name}"
                }

                // Repackage
                delete(distributionFile)
                ant.zip(destfile: distributionFile) {
                    fileset(dir: tempDir)
                }
                println "Added ai-bridge.zip and ai-bridge.hash to plugin package and removed searchableOptions jar"
            }

            delete(tempDir)
        }
    }
}
