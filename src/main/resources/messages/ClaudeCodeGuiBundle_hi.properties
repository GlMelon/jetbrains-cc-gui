error.codexLocalAccessNotAuthorized=Codex स्थानीय कॉन्फ़िगरेशन एक्सेस अधिकृत नहीं है। कृपया स्थानीय ~/.codex एक्सेस अधिकृत करें या पहले एक प्रबंधित Codex प्रदाता सक्षम करें।
error.nodeNotFound.title=वातावरण जाँच विफल
error.nodeNotFound.message=Node.js नहीं मिला (कृपया नीचे सहेजें और पुनरारंभ करें)\n\nकृपया सुनिश्चित करें:\n• Node.js इंस्टॉल है (टर्मिनल में चलाएं: node --version)\n\nयदि स्वत: पता लगाना विफल होता है, तो Node.js पथ प्राप्त करने के लिए टर्मिनल में निम्न कमांड चलाएं:\n    node -p "process.execPath"\n\n⚠️ Windows उपयोगकर्ता: पथ पूर्ण एक्सेक्यूटेबल फ़ाइल (node.exe) की ओर इंगित करना चाहिए, न कि केवल निर्देशिका।\nउदाहरण: C:\\Program Files\\nodejs\\node.exe\n\nपता लगाया गया Node.js पथ: {0}
error.nodeVersionTooOld.title=Node.js संस्करण समर्थित नहीं है
error.nodeVersionTooOld.message=Node.js संस्करण बहुत पुराना है\n\nवर्तमान संस्करण: {0}\nन्यूनतम आवश्यक: v{1}\n\nकृपया Node.js को v{1 या उससे अधिक में अपग्रेड करें और पुनः प्रयास करें।\n\nपता लगाया गया Node.js पथ: {2}

