<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F5FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景已移除:透明背景,适配 IDEA 亮/暗主题 -->

  <!-- 头盔主体 -->
  <ellipse cx="200" cy="140" rx="100" ry="90" fill="url(#bodyGrad)" stroke="#2A2A2A" stroke-width="3"/>
  
  <!-- 头盔面罩 -->
  <rect x="120" y="90" width="160" height="100" rx="50" fill="#1A1A2E"/>
  
  <!-- 发光眼睛 -->
  <circle cx="165" cy="140" r="22" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="235" cy="140" r="22" fill="url(#eyeGlow)" filter="url(#glow)"/>
  
  <!-- 眼睛高光 -->
  <circle cx="158" cy="132" r="6" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="228" cy="132" r="6" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- 微笑嘴巴 -->
  <path d="M170 175 Q200 190 230 175" fill="none" stroke="#00F5FF" stroke-width="3" filter="url(#glow)"/>
  
  <!-- 身体 -->
  <rect x="155" y="220" width="90" height="70" rx="15" fill="url(#bodyGrad)" stroke="#2A2A2A" stroke-width="2"/>
  
  <!-- 手臂 -->
  <rect x="115" y="230" width="40" height="25" rx="12" fill="url(#bodyGrad)" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="245" y="230" width="40" height="25" rx="12" fill="url(#bodyGrad)" stroke="#2A2A2A" stroke-width="2"/>
  
  <!-- 手（圆形） -->
  <circle cx="110" cy="255" r="12" fill="url(#bodyGrad)" stroke="#2A2A2A" stroke-width="2"/>
  <circle cx="290" cy="255" r="12" fill="url(#bodyGrad)" stroke="#2A2A2A" stroke-width="2"/>
  
  <!-- 键盘 -->
  <rect x="120" y="290" width="160" height="50" rx="8" fill="#2A2A2A" stroke="#3A3A3A" stroke-width="2"/>
  
  <!-- 键盘按键 -->
  <rect x="130" y="300" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="148" y="300" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="166" y="300" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="184" y="300" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="202" y="300" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="220" y="300" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="238" y="300" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="256" y="300" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  
  <rect x="135" y="318" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="153" y="318" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="171" y="318" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="189" y="318" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="207" y="318" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="225" y="318" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  <rect x="243" y="318" width="12" height="12" rx="2" fill="#00F5FF" opacity="0.8"/>
  <rect x="261" y="318" width="12" height="12" rx="2" fill="#00FF87" opacity="0.8"/>
  
  <!-- 空格键 -->
  <rect x="160" y="336" width="80" height="8" rx="2" fill="#3A3A3A"/>
  
  <!-- 代码符号 -->
  <text x="200" y="80" font-family="monospace" font-size="16" font-weight="bold"
        fill="url(#codeGrad)" text-anchor="middle" filter="url(#glow)">&lt;/&gt;</text>
</svg>