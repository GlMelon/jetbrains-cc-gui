<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FACFE;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0B0E14" rx="40" />
  
  <!-- CENTER ROBOT: Cool Abstract Head -->
  <g transform="translate(200, 200)" filter="url(#neonGlow)">
    <!-- Outer Hexagon Frame -->
    <path d="M0 -100 L86.6 -50 L86.6 50 L0 100 L-86.6 50 L-86.6 -50 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" />
    
    <!-- Inner Face Shield -->
    <path d="M0 -70 L60.6 -35 L60.6 35 L0 70 L-60.6 35 L-60.6 -35 Z" fill="#1A1F29" stroke="#2A2F3A" stroke-width="2" />
    
    <!-- Eyes (Horizontal Slits) -->
    <rect x="-40" y="-20" width="25" height="8" fill="#00F2FE" />
    <rect x="15" y="-20" width="25" height="8" fill="#00F2FE" />
    
    <!-- Mouth Grill -->
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#4FACFE" stroke-width="2" />
    <line x1="-15" y1="38" x2="15" y2="38" stroke="#4FACFE" stroke-width="2" />
    
    <!-- Antenna -->
    <line x1="0" y1="-100" x2="0" y2="-125" stroke="#00F2FE" stroke-width="2" />
    <circle cx="0" cy="-130" r="6" fill="#00F2FE" />
  </g>
</svg>