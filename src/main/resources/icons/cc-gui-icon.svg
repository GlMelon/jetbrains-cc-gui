<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="16" height="16" rx="3" fill="#0B0E14" />
  
  <!-- Robot Head -->
  <g transform="translate(8, 8.5)">
    <!-- Antenna -->
    <line x1="0" y1="-4" x2="0" y2="-6" stroke="#4FACFE" stroke-width="1" />
    <circle cx="0" cy="-6.5" r="0.8" fill="#00F2FE" />
    
    <!-- Head Hexagon -->
    <path d="M0 -3.5 L3 -1.75 L3 1.75 L0 3.5 L-3 1.75 L-3 -1.75 Z" fill="#1A1F29" stroke="#4FACFE" stroke-width="0.5" />
    
    <!-- Eyes -->
    <rect x="-1.5" y="-0.5" width="1" height="0.5" fill="#00F2FE" />
    <rect x="0.5" y="-0.5" width="1" height="0.5" fill="#00F2FE" />
    
    <!-- Mouth -->
    <line x1="-1" y1="1.25" x2="1" y2="1.25" stroke="#4FACFE" stroke-width="0.4" />
  </g>
</svg>